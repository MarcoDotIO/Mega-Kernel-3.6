[build-system]
requires = ["setuptools>=68", "wheel", "torch>=2.7", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "mega-kernel-qwen36"
version = "0.1.0"
description = "Decode-path CUDA/Triton kernels and references for Qwen3.6"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7",
    "triton>=3.3; platform_system == 'Linux'",
]

[project.optional-dependencies]
dev = [
    "ninja>=1.11",
    "pytest>=8",
    "pybind11>=2.13",
    "transformers>=4.57.1",
    "huggingface_hub>=0.30",
    "safetensors>=0.5",
]

parity = [
    "vllm==0.19.1",
    "sglang==0.5.10.post1",
]

[tool.setuptools.packages.find]
include = ["mega_kernel_qwen36*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
